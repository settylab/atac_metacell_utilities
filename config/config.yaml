scripts: "workflow/scripts/"
output: # <Output directory here> 
logs: "logs/"
interactive_clean: True

renv_loc: renv/library/R-4.1/x86_64-pc-linux-gnu

anndata:
    atac: # <path/to/SEACell/ATAC/AnnData/here>
    rna: # <path/to/SEACell/RNA/AnnData/here>
    sc_atac:  # <path/to/Single-cel/ATAC/AnnData/here>
    sc_rna: # <path/to/Single-cel/RNA/AnnData/here>
    # documenting what label was used to create the SEACells AnnData - also used for differential accessibility
    SEACell_label: "SEACell"
peaks:
    width: 150
    genome: # Specify genome here
    meme_file: "data/cis-bp-tf-information.meme"

ins_chip:
    # set verbose to "--verbose" for True
    verbose: ""
    min_chip_score: 0.15
    min_peak_hits: 30

gene_peak_corr_config:
    # set test_set to "--test_set" for True
    n_jobs: 1
    test_set: ""
    n_genes: 20

gene_peak_corr_cutoffs:
    min_corr: 0.0
    max_pval: 0.1
    min_peaks: 2
    
diff_acc:
    cell_type_obs: # Specify obs which contains the cell type information .Eg: "celltype"
    # to_compare is auto-generated from peak_selection targets.
    # Use extra_comparisons to add pairs not covered by targets.
    extra_comparisons: ""

peak_selection:
    # Each key under targets is a lineage name.
    # target_celltype: the cell type representing this lineage
    # start: the stem/progenitor cell type
    # reference: dict of {lineage_name: cell_type} for other lineages
    # min_logFC / max_logFC: thresholds for differential accessibility filtering
    targets:
        # Example:
        # Bcells:
        #     target_celltype: "proB"
        #     start: "HSC"
        #     reference:
        #         Ery: "EryPre1"
        #         Mono: "Mono"
        #     min_logFC: 0
        #     max_logFC: 0.25
        # Erythroid:
        #     target_celltype: "EryPre1"
        #     start: "HSC"
        #     reference:
        #         Bcells: "proB"
        #         Mono: "Mono"
        #     min_logFC: 0
        #     max_logFC: 0.25
    
